<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Неофициальный интерактивный планировщик прохождения The Life and Suffering of Prince Jerian.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23171818'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='44' fill='%23f0cc83'%3EE%3C/text%3E%3C/svg%3E">
  <title>Eterna Route Planner — The Life and Suffering of Prince Jerian</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <div id="attributeBar" class="attribute-bar">
      <button id="headerExpandButton" class="header-expand-button" type="button" aria-label="Развернуть панель" aria-controls="attributeBar" aria-expanded="false" title="Развернуть панель" data-i18n-aria-label="header.expand" data-i18n-title="header.expand">
        <span aria-hidden="true">▼</span>
      </button>
      <div class="attribute-sidebar">
        <div class="attribute-controls">
          <div class="tools-menu-wrap">
            <button id="toolsMenuButton" class="compact-control-button labeled-control-button" type="button" aria-label="Инструменты" aria-controls="toolsMenu" aria-expanded="false" title="Инструменты" data-i18n-aria-label="tools.title" data-i18n-title="tools.title">
              <span class="control-icon" aria-hidden="true">☰</span>
              <span class="control-label" data-i18n="tools.menuButton">Меню</span>
            </button>
            <div id="toolsMenu" class="tools-menu" aria-hidden="true">
              <div class="tools-group">
                <span class="tools-group-title" data-i18n="tools.navigationGroup">Навигация</span>
                <input id="search" class="search" type="search" placeholder="Найти сцену или выбор…" autocomplete="off" data-i18n-placeholder="tools.search">
                <span id="searchSummary" class="search-summary"></span>
                <select id="chapterJump" aria-label="Перейти к главе" data-i18n-aria-label="tools.chapter"></select>
              </div>
              <div class="tools-group">
                <span class="tools-group-title" data-i18n="tools.routeGroup">Маршрут</span>
                <button id="hiddenScenesButton" type="button" data-i18n="tools.hidden">Скрытые сцены</button>
                <button id="stateButton" type="button" data-i18n="tools.state">Состояние</button>
                <button id="routeFileButton" type="button" data-i18n="tools.routeFile">Маршрут: сохранить / загрузить</button>
              </div>
              <div class="tools-group">
                <span class="tools-group-title" data-i18n="tools.projectGroup">Проект</span>
                <select id="languageSelect" data-language-select aria-label="Язык интерфейса"></select>
                <a id="supportLink" class="support-link" href="https://web.tribute.tg/d/Ps8" target="_blank" rel="noopener noreferrer external" data-i18n="tools.support" data-i18n-title="tools.supportTitle">Поддержать · ₽ ↗</a>
                <details id="technicalInfoDetails" class="technical-info-details">
                  <summary data-i18n="routeInfo.button">Техническая информация</summary>
                  <div class="technical-info-content">
                    <span class="route-info-title" data-i18n="routeInfo.route">Маршрут</span>
                    <span id="summary" class="route-summary" data-i18n="routeInfo.loading">Загрузка…</span>
                    <span class="route-info-title" data-i18n="routeInfo.version">Версия</span>
                    <span id="appVersion" class="app-version">0.9.3-beta</span>
                    <span class="route-info-title" data-i18n="routeInfo.legend">Обозначения</span>
                    <div class="legend" aria-hidden="true">
                      <span data-i18n="routeInfo.available">доступно</span>
                      <span class="unavailable" data-i18n="routeInfo.unavailable">недоступно</span>
                      <span class="chosen" data-i18n="routeInfo.chosen">выбрано</span>
                    </div>
                  </div>
                </details>
              </div>
              <div class="tools-danger-zone">
                <button id="resetButton" class="danger" type="button" data-i18n="tools.reset">Сбросить выборы</button>
              </div>
            </div>
          </div>
          <button id="currentChoiceHeaderButton" class="header-current-button" type="button" title="Перейти к текущему выбору (Home)" aria-keyshortcuts="Home" data-i18n-title="header.currentTitle">
            <span class="control-icon" aria-hidden="true">◎</span>
            <span class="control-label" data-i18n="header.current">К текущему</span>
          </button>
          <button id="headerToggleButton" class="header-collapse-button" type="button" aria-label="Свернуть панель" aria-controls="attributeBar" aria-expanded="true" title="Свернуть панель" data-i18n-aria-label="header.collapse" data-i18n-title="header.collapse">
            <span class="control-icon" aria-hidden="true">▲</span>
            <span class="control-label" data-i18n="header.collapse">Свернуть панель</span>
          </button>
        </div>
        <span id="routeNotice" class="route-notice" role="status" aria-live="polite"></span>
      </div>
      <div id="attributeGroups" class="attribute-groups"></div>
    </div>
    <div class="timeline-shell">
      <button id="currentChoiceButton" class="current-choice-button" type="button" title="Перейти к текущему выбору (Home)" aria-keyshortcuts="Home" data-i18n-title="header.currentTitle">
        <span class="current-choice-icon" aria-hidden="true">◎</span>
        <span class="current-choice-label" data-i18n="header.current">К текущему</span>
      </button>
      <div class="timeline-top-controls">
        <div id="searchModeBar" class="search-mode-bar" aria-live="polite" hidden>
          <span id="searchModeText" class="search-mode-text"></span>
          <span id="searchModeCount" class="search-mode-count"></span>
          <button id="clearSearchButton" type="button" title="Выйти из режима поиска" data-i18n="search.exit" data-i18n-title="search.exitTitle">Выйти</button>
        </div>
      </div>
      <main id="timelineViewport" class="timeline-viewport">
        <div id="timeline" class="timeline"></div>
      </main>
      <div id="timelineScrollbar" class="timeline-scrollbar">
        <div class="timeline-slider-track-overlay">
          <div id="timelineSliderMarkers" class="timeline-slider-markers" aria-hidden="true"></div>
          <button id="timelineCurrentMarker" class="timeline-current-marker" type="button" hidden></button>
        </div>
        <output id="timelineSliderTooltip" class="timeline-slider-tooltip" aria-hidden="true"></output>
        <input id="timelineSlider" type="range" min="0" max="0" value="0" step="1" aria-label="Прокрутка маршрута" data-i18n-aria-label="timeline.scrollbar">
      </div>
    </div>
  </div>

  <div id="backdrop" class="backdrop"></div>
  <aside id="statePanel" class="side-panel" aria-hidden="true">
    <div class="panel-head">
      <h2 id="panelTitle" data-i18n="panel.stateTitle">Состояние прохождения</h2>
      <button id="closePanel" type="button" data-i18n="panel.close">Закрыть</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div id="routeFileBackdrop" class="route-file-backdrop"></div>
  <section id="routeFileDialog" class="route-file-dialog" role="dialog" aria-modal="true" aria-labelledby="routeFileTitle" aria-describedby="routeFileDescription" aria-hidden="true">
    <div class="route-file-head">
      <div>
        <h2 id="routeFileTitle" data-i18n="routeFile.title">Сохранение маршрута</h2>
        <p id="routeFileDescription" data-i18n="routeFile.description">Файл содержит только выбранные варианты.</p>
      </div>
      <button id="closeRouteFile" type="button" data-i18n="panel.close">Закрыть</button>
    </div>
    <div class="route-file-body">
      <p id="routeFileSummary" class="route-file-summary"></p>
      <div class="route-file-actions">
        <button id="exportRouteFileButton" class="primary" type="button" data-i18n="routeFile.download">Скачать маршрут (.json)</button>
        <button id="importRouteFileButton" type="button" data-i18n="routeFile.upload">Загрузить маршрут (.json)</button>
        <button id="exportMemoButton" type="button" data-i18n="routeFile.memo">Скачать памятку (.txt)</button>
      </div>
      <p id="routeFileStatus" class="route-file-status" role="status" aria-live="polite"></p>
      <input id="routeFileInput" type="file" accept=".json,application/json" hidden>
    </div>
  </section>

  <div id="choiceHistoryBackdrop" class="choice-history-backdrop"></div>
  <section id="choiceHistoryDialog" class="choice-history-dialog" role="dialog" aria-modal="true" aria-labelledby="choiceHistoryTitle" aria-hidden="true">
    <div class="choice-history-head">
      <div class="choice-history-heading">
        <h2 id="choiceHistoryTitle" data-i18n="history.editTitle">Изменить прошлые выборы</h2>
        <div id="choiceHistoryTarget" class="choice-history-target"></div>
      </div>
      <button id="closeChoiceHistory" type="button" data-i18n="panel.close">Закрыть</button>
    </div>
    <div id="choiceHistoryStatus" class="choice-history-status"></div>
    <div id="choiceHistoryTrack" class="choice-history-track"></div>
  </section>

  <noscript><div class="noscript">Для работы планировщика нужно разрешить JavaScript. / JavaScript must be enabled to use the planner.</div></noscript>
  <script src="locales/ui.js"></script>
  <script src="locales/en.js"></script>
  <script src="data/choice-systems.js"></script>
  <script src="data/events/chapter-1.js"></script>
  <script src="data/events/chapter-2.js"></script>
  <script src="data/events/chapter-3.js"></script>
  <script src="data/events/chapter-4.js"></script>
  <script src="data/events/chapter-5.js"></script>
  <script src="data/state-catalogue.js"></script>
  <script src="data/initial-state.js"></script>
  <script src="data/planner-data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/route-file.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
